suite: low-priority worker deployment
templates:
  - templates/worker-low-deployment.yaml
  - templates/invenio-configmap.yaml
release:
  name: test
set:
  invenio.hostname: "test.example.com"
  rabbitmq.auth.password: "test"
  postgresql.auth.password: "test"
tests:
  - it: is not rendered by default
    asserts:
      - hasDocuments:
          count: 0
        template: templates/worker-low-deployment.yaml

  - it: renders a Deployment with its own name and component label when enabled
    set:
      workerLow.enabled: true
    asserts:
      - isKind:
          of: Deployment
        template: templates/worker-low-deployment.yaml
      - equal:
          path: metadata.name
          value: test-invenio-worker-low
        template: templates/worker-low-deployment.yaml
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: worker-low
        template: templates/worker-low-deployment.yaml
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: worker-low
        template: templates/worker-low-deployment.yaml

  - it: consumes the celery and low queues by default
    set:
      workerLow.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command[2]
          value: "celery -A invenio_app.celery worker -c 2 -l INFO --queues celery,low"
        template: templates/worker-low-deployment.yaml

  - it: uses its own replicas, concurrency and queues
    set:
      workerLow.enabled: true
      workerLow.replicas: 3
      workerLow.concurrency: 1
      workerLow.queues: low
    asserts:
      - equal:
          path: spec.replicas
          value: 3
        template: templates/worker-low-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].command[2]
          value: "celery -A invenio_app.celery worker -c 1 -l INFO --queues low"
        template: templates/worker-low-deployment.yaml

  - it: adds nodeSelector when set
    set:
      workerLow.enabled: true
      workerLow.nodeSelector:
        node-role: worker-low
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            node-role: worker-low
        template: templates/worker-low-deployment.yaml
