suite: worker deployment
templates:
  - templates/worker-deployment.yaml
  - templates/invenio-configmap.yaml
release:
  name: test
set:
  invenio.hostname: "test.example.com"
  rabbitmq.auth.password: "test"
  postgresql.auth.password: "test"
tests:
  - it: renders a Deployment with correct component label
    asserts:
      - isKind:
          of: Deployment
        template: templates/worker-deployment.yaml
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: worker
        template: templates/worker-deployment.yaml

  - it: sets replicas from values
    set:
      worker.replicas: 4
    asserts:
      - equal:
          path: spec.replicas
          value: 4
        template: templates/worker-deployment.yaml

  - it: adds nodeSelector when set
    set:
      worker.nodeSelector:
        node-role: worker
    asserts:
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            node-role: worker
        template: templates/worker-deployment.yaml

  - it: adds tolerations when set
    set:
      worker.tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "worker"
          effect: "NoSchedule"
    asserts:
      - equal:
          path: spec.template.spec.tolerations[0].key
          value: dedicated
        template: templates/worker-deployment.yaml

  - it: adds pod annotations when set
    set:
      worker.podAnnotations:
        prometheus.io/scrape: "true"
    asserts:
      - exists:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
        template: templates/worker-deployment.yaml

  - it: adds extra env vars to worker container
    set:
      worker.extraEnvVars:
        - name: MY_VAR
          value: my-value
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: MY_VAR
            value: my-value
        template: templates/worker-deployment.yaml

  - it: adds affinity when set
    set:
      worker.affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values:
                        - worker
                topologyKey: kubernetes.io/hostname
    asserts:
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].weight
          value: 100
        template: templates/worker-deployment.yaml
      - equal:
          path: spec.template.spec.affinity.podAntiAffinity.preferredDuringSchedulingIgnoredDuringExecution[0].podAffinityTerm.topologyKey
          value: kubernetes.io/hostname
        template: templates/worker-deployment.yaml

  - it: adds deployment annotations when set
    set:
      worker.deployment.annotations:
        custom-annotation: "test"
    asserts:
      - equal:
          path: metadata.annotations["custom-annotation"]
          value: "test"
        template: templates/worker-deployment.yaml

  - it: does not pass --queues by default
    asserts:
      - hasDocuments:
          count: 1
        template: templates/worker-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].command[2]
          value: "celery -A invenio_app.celery worker -c 2 -l INFO"
        template: templates/worker-deployment.yaml

  - it: passes queues and extra args to the worker command
    set:
      worker.queues: ["celery", "low"]
      worker.extraArgs: ["--events"]
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command[2]
          value: "celery -A invenio_app.celery worker -c 2 -l INFO --queues celery,low --events"
        template: templates/worker-deployment.yaml

  - it: accepts queues as a comma-separated string
    set:
      worker.queues: "celery,low"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].command[2]
          value: "celery -A invenio_app.celery worker -c 2 -l INFO --queues celery,low"
        template: templates/worker-deployment.yaml

  - it: renders an extra Deployment per worker group, inheriting and overriding values
    set:
      worker.queues: ["celery"]
      worker.nodeSelector:
        node-role: worker
      worker.groups:
        low:
          queues: ["celery", "low"]
          replicas: 1
          concurrency: 1
    asserts:
      - hasDocuments:
          count: 2
        template: templates/worker-deployment.yaml
      - equal:
          path: metadata.name
          value: test-invenio-worker
        documentIndex: 0
        template: templates/worker-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].command[2]
          value: "celery -A invenio_app.celery worker -c 2 -l INFO --queues celery"
        documentIndex: 0
        template: templates/worker-deployment.yaml
      - equal:
          path: metadata.name
          value: test-invenio-worker-low
        documentIndex: 1
        template: templates/worker-deployment.yaml
      - equal:
          path: spec.selector.matchLabels["app.kubernetes.io/component"]
          value: worker-low
        documentIndex: 1
        template: templates/worker-deployment.yaml
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/component"]
          value: worker-low
        documentIndex: 1
        template: templates/worker-deployment.yaml
      - equal:
          path: spec.replicas
          value: 1
        documentIndex: 1
        template: templates/worker-deployment.yaml
      - equal:
          path: spec.template.spec.containers[0].command[2]
          value: "celery -A invenio_app.celery worker -c 1 -l INFO --queues celery,low"
        documentIndex: 1
        template: templates/worker-deployment.yaml
      - equal:
          path: spec.template.spec.nodeSelector
          value:
            node-role: worker
        documentIndex: 1
        template: templates/worker-deployment.yaml
